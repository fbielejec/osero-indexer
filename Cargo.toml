[package]
name = "osero-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "0.8", features = ["full", "provider-ws", "signer-local"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
futures = "0.3"
toml = "0.8"

[features]
live-smoke = []

[dev-dependencies]
